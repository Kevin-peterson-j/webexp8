<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AngularJS - Simple Calculator</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    input, select {
      padding: 6px;
      margin: 5px 0;
      font-size: 14px;
    }
    .result-text {
      font-size: 18px;
      font-weight: bold;
      color: #1a365d;
      margin-top: 15px;
    }
  </style>
</head>
<body ng-app="CalculatorApp">

  <div ng-controller="CalculatorController">
    <h2>AngularJS Calculator</h2>
    <p>Number 1: <br><input type="number" ng-model="a"></p>
    <p>Number 2: <br><input type="number" ng-model="b"></p>
    <p>Operator: <br>
      <select ng-model="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
    </p>

    <p class="result-text">Result: {{ result() }}</p>
  </div>

  <script>
    angular.module('CalculatorApp', [])
      .controller('CalculatorController', function($scope) {
        $scope.a = 2;
        $scope.b = 4;
        $scope.operator = '+';

        $scope.result = function() {
          if ($scope.a === undefined || $scope.b === undefined) {
            return "Please enter both numbers";
          }

          if ($scope.operator === '+') {
            return $scope.a + $scope.b;
          }
          if ($scope.operator === '-') {
            return $scope.a - $scope.b;
          }
          if ($scope.operator === '*') {
            return $scope.a * $scope.b;
          }
          if ($scope.operator === '/') {
            return $scope.b !== 0 ? ($scope.a / $scope.b) : "Cannot divide by zero";
          }
          return "";
        };
      });
  </script>
</body>
</html>
