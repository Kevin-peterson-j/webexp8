<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AngularJS - Todo List</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 25px;
    }
    input {
      padding: 6px 10px;
      width: 250px;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    ul {
      margin-top: 15px;
      padding-left: 20px;
    }
    li {
      margin-bottom: 5px;
      font-size: 15px;
    }
  </style>
</head>
<body ng-app="todoApp">

  <div ng-controller="todoController">
    <h2>AngularJS To-Do List</h2>
    <input type="text" ng-model="title" placeholder="Enter task name...">
    <button ng-click="add()">Add</button>

    <ul>
      <li ng-repeat="t in tasks track by $index">{{ t }}</li>
    </ul>
  </div>

  <script>
    angular.module('todoApp', [])
      .controller('todoController', function($scope) {
        $scope.tasks = ["item1", "item2"];

        $scope.add = function() {
          if ($scope.title && $scope.title.trim() !== "") {
            $scope.tasks.push($scope.title.trim());
            $scope.title = "";
          }
        };
      });
  </script>
</body>
</html>
